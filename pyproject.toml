[project]
name = "tech-challenge-02-recommender"
version = "0.1.0"
description = "Sistema de recomendação para e-commerce com PyTorch, DVC, MLflow e Docker"
readme = "README.md"
authors = [
    { name = "Renan Gabriel", email = "contato.rg10@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.67.1",
    "mlflow>=3.15.0",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
]

[project.scripts]
generate-data = "tech_challenge_02_recommender.data:main_generate"
prepare-data = "tech_challenge_02_recommender.data:main_prepare"
train-model = "tech_challenge_02_recommender.train:main_train"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tech_challenge_02_recommender"]